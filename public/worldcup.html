<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al's World Cup 2026 Pool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0d1b2a;color:#e8eaf6;min-height:100vh}
/* ─── HEADER ─── */
.header{background:linear-gradient(135deg,rgba(0,104,71,0.90) 0%,rgba(0,80,40,0.70) 20%,rgba(13,27,42,0.92) 40%,rgba(13,27,42,0.92) 55%,rgba(178,34,52,0.75) 70%,rgba(220,220,240,0.25) 82%,rgba(0,40,140,0.80) 100%),url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=1400&q=70') center/cover no-repeat;padding:20px 16px 0;text-align:center;border-bottom:3px solid #c9a227}
.flag-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.flag-emoji{font-size:2.4rem}
.wc-title{font-size:1.05rem;letter-spacing:3px;color:#c9a227;font-weight:700;text-transform:uppercase}
.pool-title{font-size:1.6rem;font-weight:900;color:#fff;letter-spacing:1px}
.header-meta{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
#last-updated{font-size:0.78rem;color:#aaa}
.refresh-btn{background:#c9a227;color:#0d1b2a;border:none;border-radius:4px;padding:4px 10px;font-size:0.78rem;font-weight:700;cursor:pointer}
.refresh-btn:hover{background:#e8c040}
.scoring-note{font-size:0.72rem;color:#aaa;padding:6px 0 12px}
.scoring-note b{color:#c9a227}
/* ─── TABS ─── */
.tabs{display:flex;background:#111d2c;border-bottom:2px solid #1e3050}
.tab-btn{flex:1;padding:12px 4px;background:none;border:none;color:#7a8fa6;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all .2s;border-bottom:3px solid transparent}
.tab-btn.active,.tab-btn:hover{color:#c9a227;border-bottom-color:#c9a227;background:#0d1b2a}
/* ─── MAIN ─── */
main{max-width:1200px;margin:0 auto;padding:12px 8px 40px}
.tab-content{display:none}
.tab-content.active{display:block}
/* ─── LEADERBOARD ─── */
.lb-title{font-size:1.1rem;font-weight:700;color:#c9a227;margin:12px 0 8px;text-align:center;letter-spacing:1px}
.lb-wrap{position:relative;overflow:hidden}
.trophy-bg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:260px;opacity:0.07;pointer-events:none;z-index:0}
.lb-table{position:relative;z-index:1}
.lb-table{width:100%;border-collapse:collapse;font-size:0.88rem}
.lb-table th{background:#1a2e45;color:#c9a227;padding:9px 10px;text-align:left;font-size:0.78rem;letter-spacing:1px;text-transform:uppercase}
.lb-table td{padding:9px 10px;border-bottom:1px solid #1a2e45}
.lb-table tr:hover td{background:#1a2e45}
.rank{font-weight:900;font-size:1rem;width:36px}
.player-name{font-weight:700}
.player-name.me{color:#c9a227}
.pts{font-weight:900;font-size:1.1rem;color:#fff}
.medal-1{color:#FFD700;font-size:1.2rem}
.medal-2{color:#C0C0C0;font-size:1.2rem}
.medal-3{color:#CD7F32;font-size:1.2rem}
.stat-badge{background:#1a2e45;border-radius:10px;padding:2px 7px;font-size:0.75rem;margin-left:4px;color:#7a8fa6}
.live-badge{background:#c0392b;color:#fff;border-radius:4px;padding:1px 5px;font-size:0.68rem;font-weight:700;margin-left:6px;animation:blink 1.2s infinite}
.status-badge{border-radius:4px;padding:1px 6px;font-size:0.68rem;font-weight:700;margin-left:6px;background:#1a3a1a;color:#4caf50}
.halftime-badge{background:#2a2400;color:#c9a227}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
/* ─── MATCHES ─── */
.group-card{background:#111d2c;border-radius:8px;margin-bottom:12px;overflow:hidden;border:1px solid #1e3050}
.group-header{background:#1a2e45;padding:10px 14px;display:flex;align-items:center;gap:8px}
.group-letter{background:#c9a227;color:#0d1b2a;font-weight:900;border-radius:4px;padding:2px 8px;font-size:0.85rem}
.group-teams{font-size:0.78rem;color:#7a8fa6}
.match-row{display:flex;align-items:center;padding:8px 14px;border-top:1px solid #1a2e45;gap:8px;flex-wrap:wrap}
.match-row:nth-child(even){background:#0f1e2f}
.match-date{font-size:0.7rem;color:#7a8fa6;width:52px;flex-shrink:0}
.match-teams{flex:1;min-width:140px;font-size:0.88rem;font-weight:600}
.match-score{font-size:1rem;font-weight:900;padding:2px 10px;border-radius:4px;text-align:center;width:90px;flex-shrink:0}
.match-score-col{display:flex;align-items:center;gap:6px;width:130px;flex-shrink:0}
.match-meta{display:flex;align-items:center;gap:8px;width:290px;flex-shrink:0}
.score-final{background:#1a3a1a;color:#4caf50}
.score-live{background:#1a2535;color:#e0e8f0}
.score-sched{background:#1a2e45;color:#7a8fa6;font-size:0.75rem;font-weight:600}
.correct-count{font-size:0.72rem;color:#4caf50;white-space:nowrap}
.md-badge{font-size:0.65rem;background:#1e3050;color:#7a8fa6;border-radius:3px;padding:1px 5px;margin-left:4px}
/* ─── PICKS GRID ─── */
.picks-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch}
.picks-table{border-collapse:collapse;font-size:0.72rem;width:auto}
.picks-table th{background:#1a2e45;color:#c9a227;padding:6px 5px;white-space:nowrap;position:sticky;top:0;z-index:10;font-size:0.68rem}
.picks-table th.match-col{background:#111d2c;color:#7a8fa6;text-align:left;min-width:130px;max-width:180px;position:sticky;left:0;z-index:20}
.picks-table td{padding:4px 5px;border:1px solid #1a2e45;text-align:center;white-space:nowrap}
.picks-table td.match-info{background:#111d2c;color:#e8eaf6;text-align:left;position:sticky;left:0;z-index:5;padding:4px 8px}
.picks-table td.match-info span{display:block;font-size:0.65rem;color:#7a8fa6}
.cell-correct{background:#1a3a1a!important;color:#4caf50!important;font-weight:700}
.cell-wrong{background:#3a1a1a!important;color:#c0392b!important}
.cell-pending{background:#1a2e45;color:#aaa}
.cell-live-on{background:#1a3a1a!important;color:#4caf50!important;font-weight:700;animation:cell-pulse 1.8s ease-in-out infinite}
.cell-live-off{background:#3a1a1a!important;color:#c0392b!important;animation:cell-pulse 1.8s ease-in-out infinite}
@keyframes cell-pulse{0%,100%{opacity:1}50%{opacity:.45}}
.filter-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{background:#111d2c;border:1px solid #1e3050;color:#e8eaf6;padding:5px 8px;border-radius:4px;font-size:0.8rem}
.player-dropdown{position:relative;display:inline-block}
.player-dd-btn{background:#111d2c;border:1px solid #1e3050;color:#e8eaf6;padding:5px 10px;border-radius:4px;font-size:0.8rem;cursor:pointer;font-family:inherit;min-width:150px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.player-dd-btn:hover{border-color:#c9a227;color:#c9a227}
.player-dd-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;background:#111d2c;border:1px solid #1e3050;border-radius:6px;padding:4px 0;z-index:100;min-width:170px;box-shadow:0 4px 16px rgba(0,0,0,.6);max-height:280px;overflow-y:auto}
.player-dd-panel.open{display:block}
.player-dd-item{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:0.8rem;color:#e8eaf6}
.player-dd-item:hover{background:#1a2e45}
.player-dd-item input{accent-color:#c9a227;cursor:pointer;width:14px;height:14px}
.player-dd-clear{border-top:1px solid #1e3050;margin-top:4px;padding:6px 12px;color:#c0392b;font-size:0.75rem;cursor:pointer;text-align:center}
.player-dd-clear:hover{background:#1a2e45}
.action-links{display:flex;gap:5px;align-items:center}
.action-link{font-size:0.68rem;background:#1a2e45;color:#c9a227;text-decoration:none;border-radius:4px;padding:2px 6px;white-space:nowrap;border:1px solid #1e3050;cursor:pointer}
.action-link:hover{background:#1e3050;color:#e8c040}
.watch-link{background:#1a0a0a;color:#ff6b6b;border-color:#3a1a1a;animation:blink 1.2s infinite}
.watch-link:hover{background:#2a1010;color:#ff8888}
.trend-up{color:#4caf50;font-size:0.85rem;font-weight:900;margin-left:4px;animation:trend-pulse 1.8s ease-in-out infinite}
.trend-down{color:#c0392b;font-size:0.85rem;font-weight:900;margin-left:4px;animation:trend-pulse 1.8s ease-in-out infinite}
.trend-same{color:#7a8fa6;font-size:0.7rem;margin-left:5px;animation:trend-pulse 2.5s ease-in-out infinite}
.trend-first{color:#4a5e72;font-size:0.7rem;margin-left:5px;animation:trend-pulse 2.5s ease-in-out infinite}
.pts-earned-pos{color:#4caf50;font-size:0.78rem;font-weight:700;margin-left:5px}
.pts-earned-zero{color:#7a8fa6;font-size:0.72rem;margin-left:5px}
.lb-live-badge{background:#c0392b;color:#fff;border-radius:4px;padding:1px 6px;font-size:0.68rem;font-weight:700;margin-left:8px;animation:blink 1.2s infinite;vertical-align:middle}
.tab-live-dot{width:7px;height:7px;background:#c0392b;border-radius:50%;display:inline-block;margin-left:6px;vertical-align:middle;animation:blink 1.2s infinite}
.tab-live-dot.hidden{display:none}
@keyframes trend-pulse{0%,100%{opacity:1}50%{opacity:.25}}
.toggle-btn{background:#111d2c;border:1px solid #1e3050;color:#7a8fa6;padding:5px 12px;border-radius:4px;font-size:0.8rem;cursor:pointer;font-family:inherit;transition:all .15s}
.toggle-btn.active{background:#1a2e45;border-color:#c9a227;color:#c9a227;font-weight:700}
.toggle-btn:hover{border-color:#c9a227;color:#c9a227}
/* ─── BANNER LIVE ─── */
.banner-live{padding:10px 14px 0;display:flex;flex-direction:column;gap:8px}
.banner-row{display:flex;gap:8px;flex-wrap:nowrap}
.banner-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 12px;flex:1;min-width:0;text-align:left}
.bc-label{font-size:0.58rem;text-transform:uppercase;letter-spacing:1px;color:#7a8fa6;display:block;margin-bottom:3px}
.bl-name{font-size:1rem;font-weight:800;color:#c9a227;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-pts{font-size:0.68rem;color:#aaa}
.bm-teams{font-size:0.8rem;font-weight:700;color:#fff;display:block;line-height:1.4}
.bm-score{color:#c9a227;font-size:1rem;font-weight:900;margin:0 4px}
.bm-correct{font-size:0.63rem;color:#4caf50;display:block;margin-top:2px}
.bp-dots{display:flex;gap:2px;flex-wrap:wrap;margin:3px 0 2px}
.bp-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.bp-done{background:#4caf50}
.bp-live{background:#c0392b;animation:blink 1.2s infinite}
.bp-sched{background:#1a2e45;border:1px solid #2a4060}
.bp-count{font-size:0.63rem;color:#7a8fa6}
.banner-ticker-wrap{overflow:hidden;position:relative;border-top:1px solid rgba(255,255,255,0.07);margin-top:4px;padding:7px 0}
.banner-ticker-wrap::before,.banner-ticker-wrap::after{content:'';position:absolute;top:0;width:32px;height:100%;z-index:1;pointer-events:none}
.banner-ticker-wrap::before{left:0;background:linear-gradient(to right,#0a1929,transparent)}
.banner-ticker-wrap::after{right:0;background:linear-gradient(to left,#0a1929,transparent)}
.bt-track{display:inline-flex;align-items:center;white-space:nowrap;animation:ticker-scroll 50s linear infinite}
.banner-ticker-wrap:hover .bt-track{animation-play-state:paused}
.bt-item{font-size:0.73rem;color:#c8d8e8;padding:0 14px}
.bt-item b{color:#c9a227}
.bt-sep{color:#2a4060;font-size:0.8rem}
@keyframes ticker-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
/* ─── RESPONSIVE ─── */
@media(max-width:600px){
  .pool-title{font-size:1.2rem}
  .lb-table td,.lb-table th{padding:7px 6px}
  .match-row{padding:7px 10px}
  .banner-row{flex-wrap:wrap}
  .banner-card{min-width:calc(50% - 4px);flex:unset}
  .banner-card:last-child{min-width:100%}
  .bt-item{font-size:0.68rem;padding:0 10px}
}
</style>
</head>
<body>
<header class="header">
  <div class="flag-row">
    <span class="flag-emoji">🇲🇽</span>
    <div>
      <div class="wc-title">⚽ FIFA World Cup 2026™</div>
      <div class="pool-title">AL'S WORLD CUP POOL</div>
    </div>
    <span class="flag-emoji">🇺🇸</span>
  </div>
  <div class="header-meta">
    <span id="last-updated">Loading scores…</span>
    <button class="refresh-btn" onclick="fetchScores()">⟳ Refresh</button>
  </div>
  <div class="scoring-note">
    <b>Win correct = 1 pt</b> &nbsp;|&nbsp; <b>Tie correct = 2 pts</b><br>
    <span style="white-space:nowrap">Payouts: 🥇 $275 &nbsp;🥈 $100 &nbsp;🥉 $50</span>
  </div>
  <div class="banner-live">
    <div class="banner-row">
      <div class="banner-card" id="banner-leader"><span class="bc-label">👑 Leading</span><span class="bl-name">—</span></div>
      <div class="banner-card" id="banner-motd"><span class="bc-label">⚽ Latest Result</span><span class="bm-teams" style="color:#7a8fa6">—</span></div>
      <div class="banner-card" id="banner-progress"><span class="bc-label">Today's Games</span><div class="bp-dots"></div><span class="bp-count">—</span></div>
    </div>
    <div class="banner-ticker-wrap"><div class="bt-track" id="banner-ticker"><span class="bt-item" style="color:#7a8fa6">Loading…</span></div></div>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" onclick="showTab('leaderboard',this)">🏆 Leaderboard<span id="tab-live-dot" class="tab-live-dot hidden"></span></button>
  <button class="tab-btn" onclick="showTab('matches',this)">⚽ Results</button>
  <button class="tab-btn" onclick="showTab('picks',this)">📋 All Picks</button>
</nav>

<main>
  <div id="tab-leaderboard" class="tab-content active">
    <div class="lb-title">🏆 STANDINGS</div>
    <div class="lb-wrap">
      <svg class="trophy-bg" viewBox="0 0 160 290" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFD700"/>
            <stop offset="50%" style="stop-color:#c9a227"/>
            <stop offset="100%" style="stop-color:#8a6010"/>
          </linearGradient>
        </defs>
        <!-- Globe top -->
        <circle cx="80" cy="40" r="32" fill="url(#tg)"/>
        <ellipse cx="80" cy="40" rx="32" ry="13" fill="none" stroke="#8a6010" stroke-width="2"/>
        <line x1="80" y1="8" x2="80" y2="72" stroke="#8a6010" stroke-width="2"/>
        <line x1="48" y1="40" x2="112" y2="40" stroke="#8a6010" stroke-width="2"/>
        <!-- Left figure reaching up -->
        <path d="M48,72 C36,62 34,46 42,36 C46,30 54,34 57,42 C61,52 58,66 56,76" fill="url(#tg)"/>
        <!-- Right figure reaching up -->
        <path d="M112,72 C124,62 126,46 118,36 C114,30 106,34 103,42 C99,52 102,66 104,76" fill="url(#tg)"/>
        <!-- Body -->
        <path d="M54,76 C57,92 57,108 60,120 L100,120 C103,108 103,92 106,76 Z" fill="url(#tg)"/>
        <!-- Stem -->
        <rect x="68" y="120" width="24" height="58" rx="5" fill="url(#tg)"/>
        <!-- Base green bands -->
        <rect x="58" y="178" width="44" height="9" rx="2" fill="#1a5a1a"/>
        <rect x="50" y="187" width="60" height="14" rx="2" fill="url(#tg)"/>
        <rect x="44" y="201" width="72" height="9" rx="2" fill="#1a5a1a"/>
        <rect x="38" y="210" width="84" height="22" rx="3" fill="url(#tg)"/>
        <!-- Player name engraved on base -->
        <text id="trophy-name" x="80" y="225" text-anchor="middle" font-size="9" font-weight="900" font-family="Arial,sans-serif" fill="#5a3a00" letter-spacing="1"></text>
      </svg>
      <table class="lb-table">
        <thead><tr>
          <th>#</th><th>Player</th><th>Points</th>
          <th id="record-header">Record</th>
        </tr></thead>
        <tbody id="lb-body"><tr><td colspan="4" style="text-align:center;padding:20px;color:#7a8fa6">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-matches" class="tab-content">
    <div class="filter-bar" style="margin-bottom:10px">
      <button class="toggle-btn" id="view-group" onclick="setMatchView('group',this)">📁 By Group</button>
      <button class="toggle-btn active" id="view-chrono" onclick="setMatchView('chrono',this)">🕐 Chronological</button>
    </div>
    <div id="matches-content"><div style="text-align:center;padding:30px;color:#7a8fa6">Loading…</div></div>
  </div>

  <div id="tab-picks" class="tab-content">
    <div class="filter-bar">
      <select id="filter-group" onchange="renderPicks()">
        <option value="">All Groups</option>
        <option>A</option><option>B</option><option>C</option><option>D</option>
        <option>E</option><option>F</option><option>G</option><option>H</option>
        <option>I</option><option>J</option><option>K</option><option>L</option>
      </select>
      <select id="filter-md" onchange="renderPicks()">
        <option value="">All Matchdays</option>
        <option value="1">Matchday 1</option>
        <option value="2">Matchday 2</option>
        <option value="3">Matchday 3</option>
      </select>
      <button class="action-link" onclick="clearAllFilters()" style="padding:5px 10px;font-size:0.8rem">✕ Clear Filters</button>
    </div>
    <div id="player-chips"></div>
    <div class="picks-wrapper">
      <table class="picks-table" id="picks-table">
        <thead><tr id="picks-header"></tr></thead>
        <tbody id="picks-body"></tbody>
      </table>
    </div>
  </div>
</main>

// Normalize ESPN names → pool canonical names
const ESPN_MAP = {
  'United States':'USA','Türkiye':'Turkey',
  'Bosnia-Herzegovina':'Bosnia','Congo DR':'Congo',
  'Curaçao':'Curacao','Korea Republic':'South Korea',
  'Czech Republic':'Czechia'
};
function norm(n){ return ESPN_MAP[n]||n; }

// Determine result from scores
function getResult(t1,s1,t2,s2,status){
  const done = status==='Full Time'||status==='Final'||status==='FT';
  const live = status==='In Progress'||status==='Halftime'||status==='Second Half'||status==='First Half';
  if(!done && !live) return null; // not played
  const n1=parseInt(s1)||0, n2=parseInt(s2)||0;
  if(n1>n2) return {winner:t1,done,live};
  if(n2>n1) return {winner:t2,done,live};
  return {winner:'Tie',done,live};
}

function pts(pick,result){
  if(!result||!result.done) return null;
  if(pick===result.winner) return result.winner==='Tie'?2:1;
  return 0;
}

// Global state
let results = {}; // espnId → {winner,done,live,score}
let matchTimes = {}; // espnId → "12:00 PM PT"
let matchTimestamps = {}; // espnId → epoch ms for sorting
let matchClocks = {}; // espnId → "46'" (live clock)
let matchView = 'chrono'; // 'group' | 'chrono'
let liveIds = new Set();

function setMatchView(view, btn){
  matchView = view;
  document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderMatches();
}

function toPT(utcStr){
  try{
    return new Date(utcStr).toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit',hour12:true})+' PT';
  }catch(e){return '';}
}

async function fetchScores(){
  document.getElementById('last-updated').textContent='Updating…';
  try{
    const r = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/FIFA.WORLD/scoreboard?dates=20260611-20260628&limit=100');
    const data = await r.json();
    results={};matchTimes={};liveIds=new Set();matchClocks={};
    for(const ev of (data.events||[])){
      const comp=ev.competitions[0];
      const teams=comp.competitors;
      const t1=norm(teams[0].team.displayName);
      const t2=norm(teams[1].team.displayName);
      const s1=teams[0].score||'0';
      const s2=teams[1].score||'0';
      const status=comp.status.type.description;
      if(ev.date){
        const d=new Date(ev.date);
        matchTimes[ev.id]=toPT(ev.date);
        matchTimestamps[ev.id]=d.getTime();
        // Store PT date string for display
        MATCH_DATES[ev.id]=d.toLocaleDateString('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric'});
      }
      // Capture live game clock (e.g. "46'")
      const rawClock=comp.status.displayClock;
      if(rawClock && rawClock!=='0:00'){
        const mins=rawClock.split(':')[0];
        matchClocks[ev.id]=mins+"'";
      }
      const res=getResult(t1,parseInt(s1),t2,parseInt(s2),status);
      if(res){
        results[ev.id]={...res,t1,t2,s1,s2,status};
        if(res.live) liveIds.add(ev.id);
      } else {
        results[ev.id]={winner:null,done:false,live:false,t1,t2,s1,s2,status};
      }
    }
    const now=new Date();
    const gamesPlayed=MATCHES.filter(m=>results[m.id]&&results[m.id].done).length;
    const gamesLeft=MATCHES.filter(m=>!results[m.id]||(!results[m.id].done&&!results[m.id].live)).length;
    document.getElementById('last-updated').textContent=`Updated ${now.toLocaleTimeString()}${liveIds.size?' · '+liveIds.size+' LIVE':''} · ${gamesPlayed} played · ${gamesLeft} left`;
    renderAll();
    // auto-refresh faster if live matches
    clearInterval(autoTimer);
    autoTimer=setInterval(fetchScores, liveIds.size>0?30000:60000);
  }catch(e){
    document.getElementById('last-updated').textContent='Error loading scores — click Refresh';
  }
}

// Calculate per-player totals
function calcTotals(){
  return PLAYERS.map((p,pi)=>{
    let pts_total=0, correct=0, wins=0, ties=0, wrong=0, pending=0;
    for(const m of MATCHES){
      const res=results[m.id];
      const pick=m.p[pi];
      if(!res||!res.done){ pending++; continue; }
      const p2=pts(pick,res);
      if(p2===2){ pts_total+=p2; correct++; ties++; }
      else if(p2===1){ pts_total+=p2; correct++; wins++; }
      else{ wrong++; }
    }
    return {name:p,pts:pts_total,correct,wins,ties,wrong,pending,isMe:pi===DAVID_IDX};
  });
}

function renderAll(){
  renderLeaderboard();
  renderBanner();
  const activeTab=document.querySelector('.tab-content.active');
  if(activeTab&&activeTab.id==='tab-matches') renderMatches();
  if(activeTab&&activeTab.id==='tab-picks') renderPicks();
}

function renderBanner(){
  renderBannerLeader();
  renderBannerMotd();
  renderBannerProgress();
  renderBannerTicker();
}

function renderBannerLeader(){
  const el=document.getElementById('banner-leader');
  if(!el) return;
  const totals=calcTotals().sort((a,b)=>b.pts-a.pts||(a.pending-b.pending));
  if(!totals.length) return;
  const top=totals[0];
  const tied=totals.filter(t=>t.pts===top.pts);
  const nameStr=tied.length>1?tied.map(t=>t.name).join(' & '):top.name;
  el.innerHTML=`<span class="bc-label">👑 Leading</span><span class="bl-name">${nameStr}</span><span class="bl-pts">${top.pts} pts</span>`;
}

function renderBannerMotd(){
  const el=document.getElementById('banner-motd');
  if(!el) return;
  const done=MATCHES.filter(m=>results[m.id]&&results[m.id].done);
  if(!done.length){el.innerHTML='<span class="bc-label">⚽ Latest Result</span><span class="bm-teams" style="color:#7a8fa6">No results yet</span>';return;}
  const maxTs=Math.max(...done.map(m=>matchTimestamps[m.id]||0));
  const m=done.find(mm=>(matchTimestamps[mm.id]||0)===maxTs)||done[done.length-1];
  const res=results[m.id];
  const s1=res.t1===m.t1?res.s1:res.s2;
  const s2=res.t1===m.t1?res.s2:res.s1;
  let correct=0;
  PLAYERS.forEach((_,pi)=>{if(pts(m.p[pi],res)>0)correct++;});
  el.innerHTML=`<span class="bc-label">⚽ Latest Result</span>
    <span class="bm-teams">${m.t1}<span class="bm-score">${s1}–${s2}</span>${m.t2}</span>
    <span class="bm-correct">✅ ${correct}/${PLAYERS.length} correct</span>`;
}

function renderBannerProgress(){
  const el=document.getElementById('banner-progress');
  if(!el) return;
  const todayStr=new Date().toLocaleDateString('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric'});
  const todayM=MATCHES.filter(m=>MATCH_DATES[m.id]===todayStr);
  if(!todayM.length){el.innerHTML='<span class="bc-label">Today\'s Games</span><span class="bp-count" style="color:#7a8fa6">None scheduled</span>';return;}
  const dots=todayM.map(m=>{
    const res=results[m.id];
    if(res&&res.done) return '<span class="bp-dot bp-done"></span>';
    if(res&&res.live) return '<span class="bp-dot bp-live"></span>';
    return '<span class="bp-dot bp-sched"></span>';
  }).join('');
  const doneC=todayM.filter(m=>results[m.id]&&results[m.id].done).length;
  const liveC=todayM.filter(m=>results[m.id]&&results[m.id].live).length;
  el.innerHTML=`<span class="bc-label">Today's Games</span><div class="bp-dots">${dots}</div><span class="bp-count">${doneC}/${todayM.length} done${liveC?' · '+liveC+' LIVE':''}`;
}

function renderBannerTicker(){
  const el=document.getElementById('banner-ticker');
  if(!el) return;
  const done=MATCHES.filter(m=>results[m.id]&&results[m.id].done)
    .sort((a,b)=>(matchTimestamps[b.id]||0)-(matchTimestamps[a.id]||0));
  if(!done.length){el.innerHTML='<span style="color:#7a8fa6;padding:0 16px;font-size:0.73rem">No results yet</span>';return;}
  const items=done.map(m=>{
    const res=results[m.id];
    const s1=res.t1===m.t1?res.s1:res.s2;
    const s2=res.t1===m.t1?res.s2:res.s1;
    return `<span class="bt-item">${m.t1} <b>${s1}–${s2}</b> ${m.t2}</span><span class="bt-sep">·</span>`;
  }).join('');
  el.innerHTML=items+items;
}

function calcLiveTrends(){
  // Only show arrows after halftime / second half / ET / shootout
  const liveSecondHalf = MATCHES.filter(m=>{
    const res=results[m.id];
    return res && res.live && (res.status==='Second Half'||res.status==='Halftime'||res.status==='Extra Time'||res.status==='Penalty Shootout');
  });
  if(!liveSecondHalf.length) return {};

  const projExtra = PLAYERS.map((p,pi)=>{
    let extra=0;
    for(const m of liveSecondHalf){
      const res=results[m.id];
      const s1=parseInt(res.s1)||0, s2=parseInt(res.s2)||0;
      const liveOutcome = s1>s2 ? res.t1 : (s2>s1 ? res.t2 : 'Tie');
      const pick=m.p[pi];
      if(pick===liveOutcome) extra += liveOutcome==='Tie'?2:1;
    }
    return extra;
  });

  const totals=calcTotals().sort((a,b)=>b.pts-a.pts||(a.pending-b.pending));
  let rank=0,prevPts=null;
  totals.forEach(t=>{ if(t.pts!==prevPts){rank++;prevPts=t.pts;} t.curRank=rank; });

  const proj=totals.map(t=>({...t, projPts:t.pts+projExtra[PLAYERS.indexOf(t.name)]}));
  const projSorted=[...proj].sort((a,b)=>b.projPts-a.projPts||(a.pending-b.pending));
  let pr=0,prevPP=null;
  projSorted.forEach(t=>{ if(t.projPts!==prevPP){pr++;prevPP=t.projPts;} t.projRank=pr; });

  const trends={};
  proj.forEach(t=>{
    if(t.projRank<t.curRank) trends[t.name]='up';
    else if(t.projRank>t.curRank) trends[t.name]='down';
    else trends[t.name]='same';
  });
  return trends;
}

// Returns per-player points earned from the most recently completed batch of matches
function calcLastGamePoints(){
  const done = MATCHES.filter(m=>results[m.id]&&results[m.id].done);
  if(!done.length) return null;
  // Find most recent timestamp
  const maxTs = Math.max(...done.map(m=>matchTimestamps[m.id]||0));
  // All matches within ~2.5 hours of the most recent (same slot)
  const recent = done.filter(m=>(matchTimestamps[m.id]||0)>=maxTs-9000000);
  const pts={};
  PLAYERS.forEach((p,pi)=>{
    let earned=0;
    for(const m of recent){
      const res=results[m.id];
      const outcome=res.t1===m.t1
        ?(parseInt(res.s1)>parseInt(res.s2)?m.t1:parseInt(res.s2)>parseInt(res.s1)?m.t2:'Tie')
        :(parseInt(res.s2)>parseInt(res.s1)?m.t1:parseInt(res.s1)>parseInt(res.s2)?m.t2:'Tie');
      const pick=m.p[pi];
      if(pick===outcome) earned += outcome==='Tie'?2:1;
    }
    pts[p]=earned;
  });
  return pts;
}

function renderLeaderboard(){
  const totals=calcTotals().sort((a,b)=>b.pts-a.pts||(a.pending-b.pending));

  // Determine live state
  const anyLive = MATCHES.some(m=>results[m.id]&&results[m.id].live);
  const trends = calcLiveTrends();
  const hasSecondHalf = Object.keys(trends).length>0;
  const hasFirstHalf = anyLive && !hasSecondHalf;

  // Tab live dot
  const tabDot = document.getElementById('tab-live-dot');
  if(tabDot) tabDot.classList.toggle('hidden', !anyLive);

  // Post-game pts (only when no live games)
  const lastPts = (!anyLive) ? calcLastGamePoints() : null;

  // Last-place player name for the "wrong" stat label
  const lastPlayer = totals[totals.length-1];
  const wrongLabel = lastPlayer ? lastPlayer.name+'s' : 'Wrong';
  const lastPlacePts = lastPlayer ? lastPlayer.pts : null;
  const hdr = document.getElementById('record-header');
  if(hdr) hdr.textContent = wrongLabel;

  const medals={1:'🥇',2:'🥈',3:'🥉'};
  let denseRank=0,prevPts=null;
  let html='';
  totals.forEach((t,i)=>{
    if(t.pts!==prevPts){ denseRank++; prevPts=t.pts; }
    const isLast = t.pts===lastPlacePts && denseRank>3;
    const badge=denseRank<=3
      ?`<span class="medal-${denseRank}">${medals[denseRank]}</span>`
      : isLast ? '💩' : `${denseRank}`;
    let trendHtml='';
    if(hasSecondHalf){
      // Rank projection arrows
      if(trends[t.name]==='up') trendHtml=`<span class="trend-up">▲</span>`;
      else if(trends[t.name]==='down') trendHtml=`<span class="trend-down">▼</span>`;
      else trendHtml=`<span class="trend-same">●</span>`;
    } else if(hasFirstHalf){
      // Game in progress, too early for projections
      trendHtml=`<span class="trend-first">●</span>`;
    } else if(lastPts){
      // Show points earned from last completed game
      const earned=lastPts[t.name]||0;
      if(earned>0) trendHtml=`<span class="pts-earned-pos">+${earned}</span>`;
      else trendHtml=`<span class="pts-earned-zero">✗</span>`;
    }
    html+=`<tr>
      <td class="rank">${badge}</td>
      <td class="player-name">${t.name}${trendHtml}</td>
      <td class="pts">${t.pts}</td>
      <td><div style="display:flex;align-items:center;gap:6px"><span style="font-size:1.15rem;font-weight:700;color:#c0392b">${t.wrong}</span><div style="line-height:1.5"><span style="display:block;font-size:0.68rem;color:#4caf50">Wins ${t.wins}</span><span style="display:block;font-size:0.68rem;color:#c9a227">Ties ${t.ties}</span></div></div></td>
    </tr>`;
  });
  document.getElementById('lb-body').innerHTML=html||'<tr><td colspan="4">No data</td></tr>';
  // Engrave leader name on trophy
  const trophyName=document.getElementById('trophy-name');
  if(trophyName&&totals.length){
    const top=totals[0];
    const tied=totals.filter(t=>t.pts===top.pts);
    trophyName.textContent=tied.length>1?tied.map(t=>t.name).join(' & ').toUpperCase():top.name.toUpperCase();
  }
}

function renderMatches(){
  let html='';
  if(matchView==='chrono'){
    const sorted=[...MATCHES].sort((a,b)=>(matchTimestamps[a.id]||0)-(matchTimestamps[b.id]||0));
    let lastDate='';
    for(const m of sorted){
      const date=MATCH_DATES[m.id]||'';
      if(date!==lastDate){
        if(lastDate) html+='</div>';
        html+=`<div class="group-card"><div class="group-header"><span class="group-letter">${date}</span></div>`;
        lastDate=date;
      }
      html+=matchRowHtml(m);
    }
    if(lastDate) html+='</div>';
  } else {
    const groups=[...new Set(MATCHES.map(m=>m.group))];
    for(const g of groups){
      const gMatches=MATCHES.filter(m=>m.group===g);
      html+=`<div class="group-card">
        <div class="group-header">
          <span class="group-letter">Group ${g}</span>
          <span class="group-teams">${GROUP_TEAMS[g]}</span>
        </div>`;
      for(const m of gMatches) html+=matchRowHtml(m);
      html+='</div>';
    }
  }
  document.getElementById('matches-content').innerHTML=html;
}

function matchRowHtml(m){
  const res=results[m.id];
  const date=MATCH_DATES[m.id]||'';
  let scoreHtml,statusBadge='';
  if(res&&res.done){
    const timeStr=matchTimes[m.id]?`<br><span style="font-size:0.62rem;font-weight:400;color:#7a8fa6">${matchTimes[m.id]}</span>`:'';
    scoreHtml=`<span class="match-score score-final">${res.t1===m.t1?res.s1:res.s2} – ${res.t1===m.t1?res.s2:res.s1}${timeStr}</span>`;
    statusBadge=`<span class="status-badge">Final</span>`;
  } else if(res&&res.live){
    const clockStr=matchClocks[m.id]?`<br><span style="font-size:0.62rem;font-weight:500;color:#7a9ab8">${matchClocks[m.id]}</span>`:'';
    scoreHtml=`<span class="match-score score-live">${res.s1}–${res.s2}${clockStr}</span>`;
    statusBadge=res.status==='Halftime'
      ?`<span class="status-badge halftime-badge">Half</span>`
      :`<span class="live-badge">LIVE</span>`;
  } else {
    const timeStr=matchTimes[m.id]||'';
    scoreHtml=`<span class="match-score score-sched">${date}${timeStr?'<br><span style="font-size:0.65rem;font-weight:500">'+timeStr+'</span>':''}`;
  }
  let correctCount=0;
  if(res&&res.done) PLAYERS.forEach((_,pi)=>{if(pts(m.p[pi],res)>0)correctCount++;});
  const correctStr=res&&res.done?`<span class="correct-count">✅ ${correctCount}/${PLAYERS.length} correct</span>`:'';
  const groupBadge=matchView==='chrono'?`<span class="md-badge">Grp ${m.group}</span>`:'';
  const watchHtml=res&&res.live?`<div class="action-links"><a class="action-link watch-link" href="https://www.foxsports.com/live/fs1" target="_blank" rel="noopener">📺 Watch</a><a class="action-link" href="https://www.espn.com/soccer/match/_/gameId/${m.id}" target="_blank" rel="noopener">📊 Stats</a></div>`:'';
  const actionHtml=res&&res.done?`<div class="action-links">
    <a class="action-link" href="#" onclick="jumpToPicks('${m.group}');return false">📋 Picks</a>
    <a class="action-link" href="https://www.espn.com/soccer/match/_/gameId/${m.id}" target="_blank" rel="noopener">🎬 Recap</a>
  </div>`:'';
  return `<div class="match-row">
    <span class="match-date">${date}</span>
    <span class="match-teams">${m.t1} <span style="color:#7a8fa6">vs</span> ${m.t2}
      <span class="md-badge">MD${m.md}</span>${groupBadge}
    </span>
    <div class="match-score-col">${scoreHtml}${statusBadge}</div>
    <div class="match-meta">${correctStr}${watchHtml}${actionHtml}</div>
  </div>`;
}

function renderPicks(){
  const fg=document.getElementById('filter-group').value;
  const fmd=parseInt(document.getElementById('filter-md').value)||0;
  const filtered=MATCHES.filter(m=>(fg?m.group===fg:true)&&(fmd?m.md===fmd:true))
    .sort((a,b)=>(matchTimestamps[a.id]||0)-(matchTimestamps[b.id]||0));
  const showAll=selectedPlayers.size===0;

  // Header
  let hdr=`<th class="match-col">Match</th>`;
  PLAYERS.forEach((p)=>{
    if(!showAll&&!selectedPlayers.has(p)) return;
    hdr+=`<th>${p}</th>`;
  });
  document.getElementById('picks-header').innerHTML=hdr;

  let body='';
  for(const m of filtered){
    const res=results[m.id];
    const date=MATCH_DATES[m.id]||'';
    const timeStr=matchTimes[m.id]?` · ${matchTimes[m.id]}`:'';
    body+=`<tr><td class="match-info">${m.t1} v ${m.t2}<span>Grp ${m.group} MD${m.md} · ${date}${timeStr}</span></td>`;
    PLAYERS.forEach((p,pi)=>{
      if(!showAll&&!selectedPlayers.has(p)) return;
      const pick=m.p[pi];
      let cls='cell-pending', label=shorten(pick);
      if(res&&res.done){
        cls=pts(pick,res)>0?'cell-correct':'cell-wrong';
      } else if(res&&res.live){
        const s1=parseInt(res.s1)||0, s2=parseInt(res.s2)||0;
        const liveOutcome=s1>s2?res.t1:(s2>s1?res.t2:'Tie');
        cls=pick===liveOutcome?'cell-live-on':'cell-live-off';
      }
      body+=`<td class="${cls}">${label}</td>`;
    });
    body+='</tr>';
  }
  document.getElementById('picks-body').innerHTML=body;
}

function initPlayerDropdown(){
  const wrap=document.getElementById('player-chips');
  wrap.innerHTML=`<div class="player-dropdown" id="player-dropdown">
    <button class="player-dd-btn" id="player-dd-btn" onclick="togglePlayerDropdown(event)">
      <span id="player-dd-label">👤 All Players</span><span>▾</span>
    </button>
    <div class="player-dd-panel" id="player-dd-panel">
      ${PLAYERS.map(p=>`<label class="player-dd-item"><input type="checkbox" value="${p}" onchange="onPlayerCheck(this)"> ${p}</label>`).join('')}
      <div class="player-dd-clear" onclick="clearPlayerFilter()">✕ Clear selection</div>
    </div>
  </div>`;
  document.addEventListener('click',e=>{
    const dd=document.getElementById('player-dropdown');
    if(dd&&!dd.contains(e.target)) document.getElementById('player-dd-panel').classList.remove('open');
  });
}

function togglePlayerDropdown(e){
  e.stopPropagation();
  document.getElementById('player-dd-panel').classList.toggle('open');
}

function onPlayerCheck(cb){
  if(cb.checked) selectedPlayers.add(cb.value);
  else selectedPlayers.delete(cb.value);
  updateDropdownLabel();
  renderPicks();
}

function clearPlayerFilter(){
  selectedPlayers.clear();
  document.querySelectorAll('#player-dd-panel input').forEach(cb=>cb.checked=false);
  updateDropdownLabel();
  renderPicks();
}

function updateDropdownLabel(){
  const lbl=document.getElementById('player-dd-label');
  if(!lbl) return;
  if(selectedPlayers.size===0) lbl.textContent='👤 All Players';
  else if(selectedPlayers.size===1) lbl.textContent=`👤 ${[...selectedPlayers][0]}`;
  else lbl.textContent=`👤 ${selectedPlayers.size} players selected`;
}

function clearAllFilters(){
  document.getElementById('filter-group').value='';
  document.getElementById('filter-md').value='';
  clearPlayerFilter();
}

function jumpToPicks(group){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-picks').classList.add('active');
  document.querySelectorAll('.tab-btn')[2].classList.add('active');
  document.getElementById('filter-group').value=group;
  renderPicks();
  window.scrollTo(0,0);
}

function showTab(id,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  if(btn) btn.classList.add('active');
  if(id==='matches') renderMatches();
  if(id==='picks') renderPicks();
}
