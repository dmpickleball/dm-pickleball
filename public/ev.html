/* ---------- HELPERS ---------- */
function num(v){var n=parseFloat(v);return isNaN(n)?null:n;}
function pct(x){return (x*100).toFixed(1)+'%';}
function etLabel(utc){
  var d=new Date(utc+':00Z');

}

  var d=new Date(iso+'T12:00:00Z');
  return d.toLocaleDateString('en-US',{timeZone:'UTC',weekday:'long',month:'long',day:'numeric'});
}

/* ---------- DE-VIG ---------- */
function devig(outcomes){
  var raw={},sum=0,have=false;
  outcomes.forEach(function(o){
    var p=num(o.price);
    raw[o.key]=p!==null?p/100:null;
    if(p!==null){sum+=p/100;have=true;}
  });
  if(!have||sum<=0)return null;
  var fair={};
  outcomes.forEach(function(o){fair[o.key]=raw[o.key]!==null?raw[o.key]/sum:null;});
  return {raw:raw,fair:fair,sum:sum,over:sum-1,hold:(sum-1)/sum};
}

/* ---------- KALSHI AUTO-FILL ---------- */
var AUTO={}, KALSHI_TS=null;
function canon(n){
  n=(n||'').toLowerCase().replace(/[^a-z]/g,'');
  var map={congodr:'congo',drcongo:'congo',drc:'congo',congo:'congo',
    korearepublic:'korea',southkorea:'korea',korea:'korea',
    turkiye:'turkey',turkey:'turkey',
    bosniaandherzegovina:'bosnia',bosnia:'bosnia',
    caboverde:'capeverde',capeverde:'capeverde',
    cotedivoire:'ivorycoast',ivorycoast:'ivorycoast',
    unitedstates:'usa',us:'usa',usa:'usa',
    czechrepublic:'czechia',czechia:'czechia',
    iriran:'iran',islamicrepublicofiran:'iran'};
  return map[n]||n;
}
function buildAuto(feed){
  AUTO={};
  if(!feed||!feed.matches)return;
  var idx={};
  feed.matches.forEach(function(fm){
    if(!fm.teams)return;
    idx[[canon(fm.teams[0]),canon(fm.teams[1])].sort().join('|')]=fm;
  });
  MATCHES.forEach(function(m){
    var fm=idx[[canon(m.t1),canon(m.t2)].sort().join('|')];
    if(!fm)return;
    var a={};
    if(fm.ml){
      var ml={};Object.keys(fm.ml).forEach(function(nm){if(/tie/i.test(nm))ml.tie=fm.ml[nm];else ml[canon(nm)]=fm.ml[nm];});
      a.ml={home:ml[canon(m.t1)],away:ml[canon(m.t2)],draw:ml.tie};
    }
    if(fm.spread){
      var t1key=Object.keys(fm.spread).filter(function(nm){return canon(nm)===canon(m.t1);})[0];
      a.spread={};
      if(t1key){Object.keys(fm.spread[t1key]).forEach(function(L){var c=fm.spread[t1key][L];a.spread[L]={home:c.y,away:c.n};});}
    }
    if(fm.total){a.total={};Object.keys(fm.total).forEach(function(L){a.total[L]={over:fm.total[L].over,under:fm.total[L].under};});}
    if(fm.btts){a.btts={yes:fm.btts.yes,no:fm.btts.no};}
    AUTO[m.id]=a;
  });
}
function autoVals(m,def){
  var a=AUTO[m.id];if(!a)return {};
  if(def.id==='ml')   return a.ml?{home:a.ml.home,draw:a.ml.draw,away:a.ml.away}:{};
  if(def.id==='btts') return a.btts?{yes:a.btts.yes,no:a.btts.no}:{};
  if(def.id==='spread'){var s=a.spread&&a.spread[String(def.line)];return s?{home:s.home,away:s.away}:{};}
  if(def.id==='total'){var t=a.total&&a.total[String(def.line)];return t?{over:t.over,under:t.under}:{};}
  return {};
}
function effPrices(m,def){
  var auto=autoVals(m,def);
  var vals={},src={};
  def.outs.forEach(function(o){
    if(auto[o.key]!==undefined&&auto[o.key]!==null){vals[o.key]=auto[o.key];src[o.key]='auto';}
    else{vals[o.key]=undefined;src[o.key]=null;}
  });
  return {vals:vals,src:src};
}

      if(s){s.className='live-status ok';s.innerHTML='● Live Kalshi prices for <b>'+countAutoMatches()+'</b> matches. <span style="color:#9fb2c6;font-size:0.68rem;font-weight:400">Fair % = de-vigged price (vig removed). Slide to express your view.</span>';}
    } else {
      if(s){s.className='live-status off';s.textContent='Live prices unavailable right now — try refreshing.';}
    }
    renderMatches();stamp();
  }).catch(function(){
    if(s){s.className='live-status off';s.textContent='Live prices unavailable — try refreshing.';}
    renderMatches();stamp();
  });
}

/* ---------- MARKET DEFS ---------- */
function marketDefs(m){
  var ln=state.lines[m.id]||{};
  var sp=ln.spread!==undefined?ln.spread:1.5;
  var tot=ln.total!==undefined?ln.total:2.5;
  return [
    {id:'ml',title:'Moneyline',outs:[{key:'home',label:m.t1},{key:'draw',label:'Draw'},{key:'away',label:m.t2}]},
    {id:'spread',title:'Spread',line:sp,lineLabel:'goals',outs:[{key:'home',label:m.t1+' &minus;'+sp},{key:'away',label:m.t2+' +'+sp}]},
    {id:'total',title:'Total Goals',line:tot,lineLabel:'O/U',outs:[{key:'over',label:'Over '+tot},{key:'under',label:'Under '+tot}]},
    {id:'btts',title:'Both Teams Score',outs:[{key:'yes',label:'Yes'},{key:'no',label:'No'}]}
  ];
}
function setLine(mid,def,v){
  state.lines[mid]=state.lines[mid]||{};state.lines[mid][def]=parseFloat(v);save();
  var m=MATCHES.find(function(x){return x.id===mid;});
  var card=document.getElementById('card-'+mid);if(!card)return;
  card.querySelector('.match-body').innerHTML=marketsHTML(m);
}

/* ---------- RENDER ---------- */
function buildDayFilter(){
  var days=[];MATCHES.forEach(function(m){if(days.indexOf(m.date)<0)days.push(m.date);});
  days.sort();
  var sel=document.getElementById('dayFilter');
  var html='<option value="all">All days ('+MATCHES.length+' matches)</option>';
  days.forEach(function(d){
    var n=MATCHES.filter(function(m){return m.date===d;}).length;
    html+='<option value="'+d+'">'+dayName(d)+' ('+n+')</option>';
  });
  sel.innerHTML=html;
  /* auto-select today */
  var today=new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
  if(days.indexOf(today)>=0)sel.value=today;
}

function renderMatches(){
  var day=document.getElementById('dayFilter').value;
  var list=MATCHES.filter(function(m){return day==='all'||m.date===day;});
  var html='',curDay='';
  if(!list.length){html='<div style="text-align:center;color:#5e7a96;padding:30px 10px;font-size:0.85rem">No matches for this day.</div>';}
  list.forEach(function(m){
    if(m.date!==curDay){
      curDay=m.date;
      html+='<div style="color:#c9a227;font-size:0.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:10px 2px 6px">'+dayName(m.date)+'</div>';
    }
    html+=matchCardHTML(m);
  });
  document.getElementById('matchList').innerHTML=html;
}

var openMatches={};
function toggleMatch(id){
  openMatches[id]=!openMatches[id];
  var m=MATCHES.find(function(x){return x.id===id;});
  var card=document.getElementById('card-'+id);
  card.classList.toggle('open',openMatches[id]);
  card.querySelector('.match-body').innerHTML=openMatches[id]?marketsHTML(m):'';
}

function getMlFair(m){
  var def=marketDefs(m)[0];
  var eff=effPrices(m,def);
  var dv=devig(def.outs.map(function(o){return {key:o.key,price:num(eff.vals[o.key])};}));
  return dv;
}

function matchCardHTML(m){
  var open=openMatches[m.id];
  var dv=getMlFair(m);
  var mlLine='';
  if(dv&&dv.fair['home']!==null){
    var h=Math.round(dv.fair['home']*100),dr=Math.round((dv.fair['draw']||0)*100),a=Math.round(dv.fair['away']*100);
    mlLine='<div class="mh-ml">'+m.t1+' <b>'+h+'%</b>&ensp;Draw <b>'+dr+'%</b>&ensp;'+m.t2+' <b>'+a+'%</b></div>';
  }
  var h='<div class="match-card'+(open?' open':'')+'" id="card-'+m.id+'">';
  h+='<div class="match-head" onclick="toggleMatch(\''+m.id+'\')">';
  h+='<span class="mh-group">'+m.group+'</span>';
  h+='<div class="mh-info"><div class="mh-teams">'+m.t1+' v '+m.t2+'</div>';
  h+='<div class="mh-time">'+etLabel(m.utc)+' &middot; MD'+m.md+'</div>';
  h+=mlLine+'</div>';
  h+='<span class="mh-caret">&#9656;</span></div>';
  h+='<div class="match-body">'+(open?marketsHTML(m):'')+'</div></div>';
  return h;
}

function marketsHTML(m){
  var defs=marketDefs(m);var out='';
  defs.forEach(function(def){out+=marketHTML(m,def);});
  out+=sliderHTML(m);
  return out;
}

function marketHTML(m,def){
  var eff=effPrices(m,def);var pr=eff.vals;
  var dv=devig(def.outs.map(function(o){return {key:o.key,price:num(pr[o.key])};}));
  var h='<div class="market"><div class="market-title"><span>'+def.title+'</span>';
  if(def.line!==undefined){
    h+='<span class="line-edit">'+def.lineLabel+' line <input type="number" step="0.5" value="'+def.line+'" onchange="setLine(\''+m.id+'\',\''+def.id+'\',this.value)"></span>';
  }
  h+='</div>';
  h+='<table class="mkt-table"><tr><th class="lbl">Outcome</th><th>Kalshi&nbsp;&cent;</th><th>Fair&nbsp;%</th></tr>';
  def.outs.forEach(function(o){
    var fair=dv?dv.fair[o.key]:null;
    var isAuto=eff.src[o.key]==='auto';
    h+='<tr><td class="lbl">'+o.label+(isAuto?' <span class="live-dot">●</span>':'')+'</td>';
    h+='<td class="cell-cents">'+(pr[o.key]!==undefined?pr[o.key]+'&cent;':'—')+'</td>';
    h+='<td class="cell-fair">'+(fair!==null?(fair*100).toFixed(1)+'%':'—')+'</td></tr>';
  });
  h+='</table>';
  if(dv){
    h+='<div class="mkt-foot"><span>House cut: <b>'+(dv.over*100).toFixed(1)+'%</b></span><span>prices sum to '+(dv.sum*100).toFixed(1)+'%</span></div>';
  } else {
    h+='<div class="mkt-empty">No Kalshi price yet — usually opens closer to kickoff.</div>';
  }
  h+='</div>';
  return h;
}

function sliderHTML(m){
  var dv=getMlFair(m);
  if(!dv||dv.fair['home']===null)return '';
  var marketPct=Math.round(dv.fair['home']*100);
  var hasView=state.winPct[m.id]!==undefined;
  var myPct=hasView?state.winPct[m.id]:marketPct;
  var rec=recHTML(m,myPct,marketPct,dv,hasView);
  var h='<div class="my-view">';
  h+='<div class="mv-header">';
  h+='<span class="mv-label">My view on <b>'+m.t1+'</b> win &nbsp;<span class="mv-val" id="mvval-'+m.id+'">'+myPct+'%</span></span>';
  if(hasView)h+='<button class="mv-reset" onclick="resetView(\''+m.id+'\')">reset</button>';
  h+='</div>';
  h+='<div class="mv-teams"><span>← '+m.t2+' wins</span><span>'+m.t1+' wins →</span></div>';
  h+='<input type="range" class="mv-slider" min="1" max="99" value="'+myPct+'" oninput="onSlider(\''+m.id+'\',this.value,'+marketPct+','+Math.round((dv.fair['away']||0)*100)+')">';
  h+='<div id="mv-rec-'+m.id+'">'+rec+'</div>';
  h+='</div>';
  return h;
}

function recHTML(m,myPct,marketPct,dv,hasView){
  if(!hasView)return '<div class="rec-hint">Slide to compare your view with the market</div>';
  var gap=myPct-marketPct;
  if(Math.abs(gap)<5)return '<div class="rec-none">Your view is close to market — no clear edge on '+m.t1+' ML</div>';
  var side=gap>0?m.t1:m.t2;
  var mktForSide=gap>0?marketPct:Math.round((dv.fair['away']||0)*100);
  var myForSide=gap>0?myPct:(100-myPct-(Math.round((dv.fair['draw']||0)*100)));
  return '<div class="rec-badge">💡 Consider <b>'+side+' ML</b> — market fair value is <b>'+mktForSide+'%</b>, your view is ~<b>'+Math.abs(gap>0?myPct:(100-myPct))+'%</b> ('+Math.abs(gap)+'pp gap)</div>';
}

function onSlider(mid,v,marketPct,awayPct){
  state.winPct[mid]=parseInt(v,10);save();
  var el=document.getElementById('mvval-'+mid);if(el)el.textContent=v+'%';
  var m=MATCHES.find(function(x){return x.id===mid;});
  var dv=getMlFair(m);
  var rec=recHTML(m,parseInt(v,10),marketPct,dv,true);
  var rel=document.getElementById('mv-rec-'+mid);if(rel)rel.innerHTML=rec;
  /* show reset button if not already there */
  var card=document.getElementById('card-'+mid);
  var header=card&&card.querySelector('.mv-header');
  if(header&&!header.querySelector('.mv-reset')){
    var btn=document.createElement('button');btn.className='mv-reset';btn.textContent='reset';
    btn.onclick=function(){resetView(mid);};
    header.appendChild(btn);
  }
}

function resetView(mid){
  delete state.winPct[mid];save();
  var m=MATCHES.find(function(x){return x.id===mid;});
  var card=document.getElementById('card-'+mid);if(!card)return;
  card.querySelector('.match-body').innerHTML=marketsHTML(m);
}

/* ---------- UTILS ---------- */
function stamp(){
  var now=new Date();
  var s=now.toLocaleString('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  document.getElementById('last-updated').textContent='Updated '+s+' PT';
}
function recalcAll(){fetchKalshi();}

/* ---------- INIT ---------- */
buildDayFilter();
renderMatches();
fetchKalshi();
</script>
</body>
</html>
