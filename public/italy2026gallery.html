<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Italy 2026 — Album</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --dark:   #281c10;
  --green:  #2d6a4f;
  --accent: #3a7d5e;
  --cream:  #faf4ea;
  --white:  #fffdf7;
  --muted:  #9a8470;
  --border: #e2d5c2;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0d1117; color: #fff; min-height: 100vh; }

/* ── Auth ── */
#auth-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100vh; padding: 40px 20px;
  background: linear-gradient(180deg, #1a2744 0%, #2d4a7a 40%, #c8956c 75%, #1a3a2a 100%);
}
.auth-card {
  background: rgba(255,255,255,0.97); border-radius: 22px;
  padding: 44px 36px; max-width: 380px; width: 100%;
  text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.45);
}
.auth-card h1 { font-size: 1.7rem; font-weight: 400; color: var(--green); margin-bottom: 6px; }
.auth-card p { font-size: 0.88rem; color: #888; margin-bottom: 28px; }
#g-signin-btn { display: flex; justify-content: center; }
#auth-error { margin-top: 14px; padding: 10px 14px; background: #fff3f3;
  border: 1px solid #f5c6cb; border-radius: 8px; color: #721c24;
  font-size: 0.85rem; display: none; }

/* ── Shell ── */
#shell { display: none; }

/* ── Topbar ── */
.topbar {
  background: #0d1117; color: #fff; position: sticky; top: 0; z-index: 200;
  padding: 0 20px; height: 52px; display: flex; align-items: center; gap: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
}
.tb-back {
  display: flex; align-items: center; gap: 6px;
  color: rgba(255,255,255,0.7); text-decoration: none;
  font-size: 0.82rem; letter-spacing: 0.02em;
  background: none; border: none; cursor: pointer;
  padding: 6px 10px; border-radius: 8px;
  transition: background 0.18s, color 0.18s;
}
.tb-back:hover { background: rgba(255,255,255,0.08); color: #fff; }
.tb-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb-title { font-size: 0.95rem; font-weight: 500; flex: 1; letter-spacing: 0.01em; }
.tb-count { font-size: 0.72rem; color: rgba(255,255,255,0.38); letter-spacing: 0.06em; }

/* ── Gallery header ── */
.gallery-header {
  padding: 28px 20px 16px;
  background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
}
.gallery-title { font-size: 1.6rem; font-weight: 300; letter-spacing: -0.01em; margin-bottom: 4px; }
.gallery-sub { font-size: 0.8rem; color: rgba(255,255,255,0.38); letter-spacing: 0.04em; }

/* ── Masonry grid ── */
.photo-grid {
  columns: 4; column-gap: 3px; padding: 3px;
}
@media (max-width: 900px) { .photo-grid { columns: 3; } }
@media (max-width: 600px) { .photo-grid { columns: 2; } }
@media (max-width: 360px) { .photo-grid { columns: 2; } }

.photo-item {
  break-inside: avoid; margin-bottom: 3px;
  position: relative; cursor: pointer;
  border-radius: 4px; overflow: hidden;
  background: #161b22; display: block;
}
.photo-item img {
  width: 100%; height: auto; display: block;
  transition: transform 0.28s ease;
}
.photo-item:hover img { transform: scale(1.03); }
.photo-item:active img { transform: scale(0.97); }
.photo-item.is-video img { width: 100%; height: auto; display: block; }
.video-placeholder {
  width: 100%; aspect-ratio: 16/9;
  background: linear-gradient(135deg, #1a2744 0%, #0d1117 100%);
  display: flex; align-items: center; justify-content: center;
}
.video-badge {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(0,0,0,0.62); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.video-badge::after {
  content: ''; border-style: solid; border-width: 9px 0 9px 18px;
  border-color: transparent transparent transparent #fff; margin-left: 4px;
}
.photo-cap {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px 8px 6px;
  background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 100%);
  color: #fff; font-size: 0.65rem; opacity: 0; transition: opacity 0.2s;
}
.photo-item:hover .photo-cap { opacity: 1; }

/* Loading / empty */
.loading-grid {
  padding: 60px 20px; text-align: center;
  color: rgba(255,255,255,0.3); font-size: 0.85rem;
}
.loading-dots::after {
  content: ''; animation: dots 1.4s infinite;
}
@keyframes dots {
  0%,20%  { content: '.'; }
  40%,60% { content: '..'; }
  80%,100%{ content: '...'; }
}

/* ── Lightbox ── */
#lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.96); z-index: 9999;
  align-items: center; justify-content: center;
}
#lightbox.open { display: flex; }
#lightbox img { max-width: 94vw; max-height: 90vh; object-fit: contain; border-radius: 6px; user-select: none; }
#lb-close {
  position: absolute; top: 16px; right: 20px;
  font-size: 1.8rem; color: rgba(255,255,255,0.45);
  background: none; border: none; cursor: pointer; z-index: 2;
  transition: color 0.2s; line-height: 1;
}
#lb-close:hover { color: #fff; }
.lb-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.15);
  color: #fff; border-radius: 50%; width: 50px; height: 50px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.4rem; transition: background 0.2s;
  user-select: none; backdrop-filter: blur(8px); z-index: 2;
}
.lb-arrow:hover { background: rgba(255,255,255,0.22); }
.lb-arrow.hidden { opacity: 0; pointer-events: none; }
#lb-prev { left: 20px; } #lb-next { right: 20px; }
#lb-counter {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  font-size: 0.72rem; color: rgba(255,255,255,0.4); letter-spacing: 0.1em;
}
#lb-vid { display:none; max-width:94vw; max-height:90vh; border-radius:6px; }
@media (max-width: 480px) {
  .lb-arrow { width: 40px; height: 40px; font-size: 1.1rem; }
  #lb-prev { left: 8px; } #lb-next { right: 8px; }
}
</style>
</head>
<body>

<!-- Auth -->
<div id="auth-screen">
  <div class="auth-card">
    <div style="font-size:2.4rem;margin-bottom:12px;">🇮🇹</div>
    <h1>Italy 2026</h1>
    <p>Sign in to view the full photo album</p>
    <div id="g-signin-btn"></div>
    <div id="auth-error">Access restricted to David &amp; Amanda.</div>
  </div>
</div>

<!-- Shell -->
<div id="shell">
  <div class="topbar">
    <a class="tb-back" href="italy2026.html">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Itinerary
    </a>
    <span class="tb-title">📷 Italy Album</span>
    <span class="tb-count" id="tb-count"></span>
  </div>

  <div class="gallery-header">
    <div class="gallery-title">Italy 2026 Album</div>
    <div class="gallery-sub" id="gallery-sub">Loading photos…</div>
  </div>

  <div id="photo-grid" class="photo-grid">
    <div class="loading-grid"><span class="loading-dots">Loading</span></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="if(event.target===this)closeLB()">
  <button id="lb-close" onclick="closeLB()">&#x2715;</button>
  <button class="lb-arrow" id="lb-prev" onclick="lbNav(-1)">&#8249;</button>
  <img id="lb-img" src="" alt="" style="display:none">
  <video id="lb-vid" controls playsinline></video>
  <button class="lb-arrow" id="lb-next" onclick="lbNav(1)">&#8250;</button>
  <div id="lb-counter"></div>
</div>

<script>
const API = 'https://dmpickleball.com';
const ALLOWED = ['davidmokblock@gmail.com','amandale91@gmail.com'];
const TOKEN_KEY = 'italy_gal_token';
let token = '';

// ── Auth ─────────────────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  // Check stored token
  const stored = localStorage.getItem(TOKEN_KEY);
  if (stored) {
    token = stored;
    showShell();
    return;
  }
  // Init Google Sign-In
  google.accounts.id.initialize({
    client_id: '648962645830-k3e3lqf21hc7qn1t5pdrni8mek85m4a6.apps.googleusercontent.com',
    callback: handleGoogleCb,
  });
  google.accounts.id.renderButton(document.getElementById('g-signin-btn'), {
    theme: 'outline', size: 'large', shape: 'rectangular', width: 260,
  });
});

async function handleGoogleCb(resp) {
  try {
    const r = await fetch(API + '/api/students?action=italy-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: resp.credential }),
    });
    const d = await r.json();
    if (d.ok && d.token) {
      token = d.token;
      localStorage.setItem(TOKEN_KEY, token);
      showShell();
    } else {
      document.getElementById('auth-error').style.display = 'block';
    }
  } catch { document.getElementById('auth-error').style.display = 'block'; }
}

function showShell() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('shell').style.display = 'block';
  loadPhotos();
}

// ── Photos ────────────────────────────────────────────────────────────────────
let _items = [];

async function loadPhotos() {
  const grid = document.getElementById('photo-grid');
  try {
    const r = await fetch(API + '/api/students?action=live-get-photos', {
      headers: { 'x-live-token': token }
    });
    const d = await r.json();
    if (!d.ok || !d.photos?.length) {
      grid.innerHTML = '<div class="loading-grid">No photos yet — check back soon.</div>';
      return;
    }
    _items = d.photos;
    document.getElementById('tb-count').textContent = `${_items.length} items`;
    document.getElementById('gallery-sub').textContent =
      `${_items.filter(p=>p.type==='photo').length} photos · ${_items.filter(p=>p.type==='video').length} videos`;

    grid.innerHTML = _items.map((p, i) => {
      if (p.type === 'video') {
        const posterHTML = p.poster
          ? `<img src="${p.poster}" alt="Video ${i+1}" loading="lazy" onerror="this.style.display='none'">`
          : `<div class="video-placeholder"></div>`;
        return `<div class="photo-item is-video" data-idx="${i}" onclick="openLB(${i})">${posterHTML}<div class="video-badge"></div>${p.caption?`<div class="photo-cap">${p.caption}</div>`:''}</div>`;
      }
      return `<div class="photo-item" data-idx="${i}" onclick="openLB(${i})"><img src="${p.url}" alt="Photo ${i+1}" loading="lazy" onerror="this.parentElement.style.display='none'">${p.caption?`<div class="photo-cap">${p.caption}</div>`:''}</div>`;
    }).join('');
  } catch {
    grid.innerHTML = '<div class="loading-grid">Could not load photos.</div>';
  }
}

// ── Lightbox ──────────────────────────────────────────────────────────────────
let _lbIdx = 0;

function openLB(idx) {
  _lbIdx = idx;
  _lbShow();
  document.getElementById('lightbox').classList.add('open');
}
function _lbShow() {
  const p = _items[_lbIdx];
  const img = document.getElementById('lb-img');
  const vid = document.getElementById('lb-vid');
  if (p.type === 'video') {
    img.style.display = 'none'; img.src = '';
    vid.style.display = 'block'; vid.src = p.url; vid.play().catch(()=>{});
  } else {
    vid.style.display = 'none'; vid.pause(); vid.src = '';
    img.style.display = 'block'; img.src = p.url;
  }
  document.getElementById('lb-prev').classList.toggle('hidden', _lbIdx === 0);
  document.getElementById('lb-next').classList.toggle('hidden', _lbIdx === _items.length - 1);
  document.getElementById('lb-counter').textContent = `${_lbIdx + 1} / ${_items.length}`;
}
function lbNav(dir) {
  const n = _lbIdx + dir;
  if (n < 0 || n >= _items.length) return;
  _lbIdx = n; _lbShow();
}
function closeLB() {
  document.getElementById('lightbox').classList.remove('open');
  const vid = document.getElementById('lb-vid');
  vid.pause(); vid.src = '';
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});
// Swipe
let _tx = 0;
document.getElementById('lightbox').addEventListener('touchstart', e => { _tx = e.touches[0].clientX; }, { passive: true });
document.getElementById('lightbox').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - _tx;
  if (Math.abs(dx) > 50) lbNav(dx < 0 ? 1 : -1);
}, { passive: true });
</script>
</body>
</html>
